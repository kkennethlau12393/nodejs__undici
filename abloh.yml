# abloh.yml - CI reads this from the PR merge base, so changes are reviewed like code.
# Keys: https://abloh.dev/docs#config

# % of mechanical breaks in changed lines your tests must catch.
threshold: 70

# true: below threshold fails abloh's check in CI. Blocks merges only if also
# marked required in branch protection.
enforce: true

# How CI rebuilds this project for abloh's check. Comments name the source file.
environment:
  runtimeImage: node:24.21.0-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553 # Node 24.21.0 resolved from the official Node images (node-version lts/* in your CI, node >=22.19.0 in package.json), pinned to the digest it names today
  installDirectory: .
  setup: .abloh/setup.sh # written by init and yours to edit. Every cold run executes it step by step
  testCommand: node --test --test-reporter=spec "test/*.js" # set by you
  sealedTestCommand: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=stdout 'test/*.js' # your node-test command with abloh's report added for proving proposed tests
  identityFiles: # a change here makes CI reinstall instead of reusing its image
    - .npmrc
  environmentValues: # literal values your CI sets. A secret goes in requiredVariables, by name
    # set by you at the prompt
    NODE_OPTIONS: "--expose-gc"
